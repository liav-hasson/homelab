apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: quizlabs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: platform
  interval: 10m
  path: ./k8s/apps/quizlabs
  prune: true
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
