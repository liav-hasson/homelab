apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: openebs
spec:
  interval: 1h
  install:
    createNamespace: true
  chart:
    spec:
      chart: openebs
      version: "4.4.0"
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  # overriding default installations (runs too many unnecessary pods)
  # only the localpv hostpath provisioner is needed for this homelab
  values:
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
    lvm-localpv:
      enabled: false
    zfs-localpv:
      enabled: false
    # disable observability stack (loki, minio, alloy)
    loki:
      enabled: false
    alloy:
      enabled: false
    localpv-provisioner:
      hostpathClass:
        isDefaultClass: true

