apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ankilabs-lookups
  labels:
    app.kubernetes.io/component: monitoring
spec:
  namespaceSelector:
    matchNames: [ankilabs]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [dictionary-lookup, sentence-lookup]
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: service
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ankilabs-postgres
  labels:
    app.kubernetes.io/component: monitoring
spec:
  namespaceSelector:
    matchNames: [ankilabs]
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: service
          replacement: postgres-exporter
