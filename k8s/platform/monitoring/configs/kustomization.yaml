apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - podmonitor.yaml
  - ankilabs-api-gateway-podmonitor.yaml
  - alerts.yaml
  - alertmanager-config.yaml
configMapGenerator:
  - name: flux-grafana-dashboards
    files:
      - dashboards/control-plane.json
      - dashboards/cluster.json
      - dashboards/logs.json
    options:
      labels:
        grafana_dashboard: "1"
        app.kubernetes.io/part-of: flux
        app.kubernetes.io/component: monitoring
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: custom-grafana-dashboards
    files:
      - dashboards/main.json
      - dashboards/apps.json
      - dashboards/homelab-logs-overview.json
      - dashboards/kubernetes-failures.json
      - dashboards/networking-ingress.json
      - dashboards/database-storage.json
      - dashboards/ankilabs-api-latency.json
    options:
      labels:
        grafana_dashboard: "1"
        kustomize.toolkit.fluxcd.io/substitute: disabled
