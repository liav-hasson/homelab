apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - podmonitor.yaml
  - ankilabs-api-gateway-podmonitor.yaml
  - application-podmonitors.yaml
  - edge-podmonitors.yaml
  - alerts.yaml
  - alertmanager-config.yaml
configMapGenerator:
  - name: homelab-grafana-dashboards
    files:
      - dashboards/homelab-overview.json
      - dashboards/platform-delivery-edge.json
      - dashboards/ankilabs-service-health.json
      - dashboards/ankilabs-search-postgres.json
      - dashboards/quizlabs-overview.json
    options:
      labels:
        grafana_dashboard: "1"
        kustomize.toolkit.fluxcd.io/substitute: disabled
