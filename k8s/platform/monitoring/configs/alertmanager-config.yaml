apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: homelab-discord-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: homelab-alerting
spec:
  route:
    receiver: discard
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - receiver: nodes-discord
        matchers:
          - name: scope
            matchType: "="
            value: nodes
      - receiver: pods-discord
        matchers:
          - name: scope
            matchType: "=~"
            value: pods|applications|database|platform
  receivers:
    - name: discard
    - name: nodes-discord
      discordConfigs:
        - apiURL:
            name: monitoring-discord-webhooks
            key: nodes-webhook-url
          sendResolved: true
          title: >-
            {{ if eq .Status "firing" }}{{ or .CommonAnnotations.name .CommonLabels.alertname }} · {{ .CommonLabels.severity }}{{ else }}Resolved · {{ or .CommonAnnotations.name .CommonLabels.alertname }}{{ end }}
          message: |-
            {{ if eq .Status "firing" -}}
            {{ range $i, $alert := .Alerts.Firing }}{{ if lt $i 10 }}{{ or $alert.Annotations.subject $alert.Labels.alertname }} · since {{ $alert.StartsAt | tz "UTC" | date "15:04" }} UTC
            {{ end }}{{ end }}{{ if gt (len .Alerts.Firing) 10 }}and {{ slice .Alerts.Firing 10 | len }} more
            {{ end }}{{ range $i, $alert := .Alerts.Resolved }}{{ if lt $i 10 }}{{ or $alert.Annotations.subject $alert.Labels.alertname }} · resolved, lasted {{ humanizeDuration ($alert.EndsAt.Sub $alert.StartsAt) }}
            {{ end }}{{ end }}{{ if gt (len .Alerts.Resolved) 10 }}and {{ slice .Alerts.Resolved 10 | len }} more resolved
            {{ end }}{{ with index .Alerts.Firing 0 }}[Dashboard]({{ .Annotations.dashboard_url }}) · [Runbook]({{ .Annotations.runbook_url }}){{ end }}
            {{- else -}}
            {{ range $i, $alert := .Alerts.Resolved }}{{ if lt $i 10 }}{{ if $i }}
            {{ end }}{{ or $alert.Annotations.subject $alert.Labels.alertname }} · lasted {{ humanizeDuration ($alert.EndsAt.Sub $alert.StartsAt) }}{{ end }}{{ end }}{{ if gt (len .Alerts.Resolved) 10 }}
            and {{ slice .Alerts.Resolved 10 | len }} more{{ end }}
            {{- end }}
    - name: pods-discord
      discordConfigs:
        - apiURL:
            name: monitoring-discord-webhooks
            key: pods-webhook-url
          sendResolved: true
          title: >-
            {{ if eq .Status "firing" }}{{ or .CommonAnnotations.name .CommonLabels.alertname }} · {{ .CommonLabels.severity }}{{ else }}Resolved · {{ or .CommonAnnotations.name .CommonLabels.alertname }}{{ end }}
          message: |-
            {{ if eq .Status "firing" -}}
            {{ range $i, $alert := .Alerts.Firing }}{{ if lt $i 10 }}{{ or $alert.Annotations.subject $alert.Labels.alertname }} · since {{ $alert.StartsAt | tz "UTC" | date "15:04" }} UTC
            {{ end }}{{ end }}{{ if gt (len .Alerts.Firing) 10 }}and {{ slice .Alerts.Firing 10 | len }} more
            {{ end }}{{ range $i, $alert := .Alerts.Resolved }}{{ if lt $i 10 }}{{ or $alert.Annotations.subject $alert.Labels.alertname }} · resolved, lasted {{ humanizeDuration ($alert.EndsAt.Sub $alert.StartsAt) }}
            {{ end }}{{ end }}{{ if gt (len .Alerts.Resolved) 10 }}and {{ slice .Alerts.Resolved 10 | len }} more resolved
            {{ end }}{{ with index .Alerts.Firing 0 }}[Dashboard]({{ .Annotations.dashboard_url }}) · [Runbook]({{ .Annotations.runbook_url }}){{ end }}
            {{- else -}}
            {{ range $i, $alert := .Alerts.Resolved }}{{ if lt $i 10 }}{{ if $i }}
            {{ end }}{{ or $alert.Annotations.subject $alert.Labels.alertname }} · lasted {{ humanizeDuration ($alert.EndsAt.Sub $alert.StartsAt) }}{{ end }}{{ end }}{{ if gt (len .Alerts.Resolved) 10 }}
            and {{ slice .Alerts.Resolved 10 | len }} more{{ end }}
            {{- end }}
