apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ankilabs-api-gateway
  labels:
    app.kubernetes.io/component: monitoring
spec:
  namespaceSelector:
    matchNames:
      - ankilabs
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
