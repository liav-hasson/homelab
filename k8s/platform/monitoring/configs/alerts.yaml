apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.nodes
      interval: 30s
      rules:
        - alert: NodeHighCPU
          expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
          for: 5m
          labels:
            scope: nodes
            severity: warning
          annotations:
            name: Node CPU high
            subject: '{{ $labels.instance }} · {{ printf "%.0f" $value }}% CPU'
            description: CPU usage has been above 90% for 5 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/homelab-overview
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#resources
        - alert: NodeHighMemory
          expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
          for: 5m
          labels:
            scope: nodes
            severity: warning
          annotations:
            name: Node memory high
            subject: '{{ $labels.instance }} · {{ printf "%.0f" $value }}% memory'
            description: Memory usage has been above 90% for 5 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/homelab-overview
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#resources
        - alert: NodeFilesystemLowSpace
          expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*"} < 15
          for: 10m
          labels:
            scope: nodes
            severity: warning
          annotations:
            name: Node disk low
            subject: '{{ $labels.mountpoint }} on {{ $labels.instance }} · {{ printf "%.0f" $value }}% free'
            description: The filesystem has had less than 15% free space for 10 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/platform-storage
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#storage
        - alert: NodeFilesystemFillingUp
          expr: predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs",mountpoint!~"/run.*"}[6h], 3 * 24 * 3600) < 0
          for: 1h
          labels:
            scope: nodes
            severity: warning
          annotations:
            name: Node disk filling up
            subject: '{{ $labels.mountpoint }} on {{ $labels.instance }}'
            description: The 6-hour write trend fills the filesystem within 3 days.
            dashboard_url: https://grafana.ankilabs.org/d/platform-storage
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#storage
    # Per-volume usage comes from the node-exporter volume-usage sidecar (du every 5 minutes),
    # joined to its claim through kube-state-metrics; kubelet volume stats are filesystem-wide
    # on openebs-hostpath.
    - name: homelab.storage
      rules:
        - alert: PersistentVolumeNearRequestedSize
          expr: |
            max by (namespace, persistentvolumeclaim) (
              max by (persistentvolume) (openebs_hostpath_volume_used_bytes)
              * on (persistentvolume) group_left (namespace, persistentvolumeclaim)
              max by (namespace, persistentvolumeclaim, persistentvolume) (label_replace(kube_persistentvolumeclaim_info, "persistentvolume", "$1", "volumename", "(.+)"))
            )
            / on (namespace, persistentvolumeclaim) max by (namespace, persistentvolumeclaim) (kube_persistentvolumeclaim_resource_requests_storage_bytes)
            > 0.9
          for: 30m
          labels:
            scope: nodes
            severity: warning
          annotations:
            name: Volume near requested size
            subject: '{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} · {{ $value | humanizePercentage }} used'
            description: The claim has used more than 90% of its requested size for 30 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/platform-storage
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#storage
        - alert: OpenEBSVolumeScanStale
          expr: time() - max(openebs_hostpath_volume_scan_timestamp_seconds) > 1200 or absent(openebs_hostpath_volume_scan_timestamp_seconds)
          for: 5m
          labels:
            scope: nodes
            severity: warning
          annotations:
            name: Volume usage scan stale
            subject: node-exporter volume-usage sidecar
            description: No per-volume usage scan newer than 20 minutes is scraped.
            dashboard_url: https://grafana.ankilabs.org/d/platform-storage
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#storage
    - name: homelab.pods
      rules:
        - alert: PodCrashLoopBackOff
          expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
          for: 5m
          labels:
            scope: pods
            severity: critical
          annotations:
            name: Pod crash-looping
            subject: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})'
            description: The container has been in CrashLoopBackOff for 5 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/homelab-overview
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#resources
        - alert: PodFrequentRestarts
          expr: increase(kube_pod_container_status_restarts_total[15m]) >= 3
          for: 5m
          labels:
            scope: pods
            severity: warning
          annotations:
            name: Pod restarting
            subject: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})'
            description: The container restarted at least 3 times in 15 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/homelab-overview
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#resources
    - name: homelab.applications
      interval: 30s
      rules:
        - alert: AnkiLabsRequestFailure
          # Include a newly discovered nonzero status series: its first failure
          # can occur before the first scrape and otherwise produce increase=0.
          expr: |
            sum by (namespace, job, service, route, status) (
              increase({__name__=~"ankilabs_(api_gateway|sentence_lookup|dictionary_lookup)_http_request_duration_seconds_count",namespace="ankilabs",status=~"5.."}[10m])
            ) > 0
            or
            sum by (namespace, job, service, route, status) (
              {__name__=~"ankilabs_(api_gateway|sentence_lookup|dictionary_lookup)_http_request_duration_seconds_count",namespace="ankilabs",status=~"5.."} > 0
              unless
              {__name__=~"ankilabs_(api_gateway|sentence_lookup|dictionary_lookup)_http_request_duration_seconds_count",namespace="ankilabs",status=~"5.."} offset 10m
            )
          labels:
            scope: applications
            severity: warning
          annotations:
            name: AnkiLabs request failure
            subject: '{{ $labels.service }} {{ $labels.route }} · {{ $labels.status }}'
            description: A 5xx request counter increased or first appeared in the last 10 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/ankilabs-service-health
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#requests
        - alert: AnkiLabsUpstreamFailure
          expr: |
            sum by (namespace, service, status) (
              increase(ankilabs_api_gateway_upstream_request_duration_seconds_count{namespace="ankilabs",service=~"Sentence Lookup|Dictionary Lookup",status=~"5..|timeout|unavailable"}[10m])
            ) > 0
            or
            sum by (namespace, service, status) (
              ankilabs_api_gateway_upstream_request_duration_seconds_count{namespace="ankilabs",service=~"Sentence Lookup|Dictionary Lookup",status=~"5..|timeout|unavailable"} > 0
              unless
              ankilabs_api_gateway_upstream_request_duration_seconds_count{namespace="ankilabs",service=~"Sentence Lookup|Dictionary Lookup",status=~"5..|timeout|unavailable"} offset 10m
            )
          labels:
            scope: applications
            severity: warning
          annotations:
            name: AnkiLabs lookup upstream failure
            subject: '{{ $labels.service }} · {{ $labels.status }}'
            description: A gateway-to-lookup failure counter increased or first appeared in the last 10 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/ankilabs-service-health
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#requests
        - alert: AnkiLabsScrapeFailed
          expr: up{namespace="ankilabs",job=~"monitoring/(ankilabs-api-gateway|ankilabs-lookups|ankilabs-postgres|ankilabs-ai-card-actions)"} == 0
          for: 3m
          labels:
            scope: applications
            severity: warning
          annotations:
            name: AnkiLabs metrics scrape failing
            subject: '{{ $labels.pod }}'
            description: The metrics target has failed scrapes for 3 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/ankilabs-service-health
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#telemetry
        - alert: AnkiLabsExpectedTargetMissing
          expr: |
            absent(up{namespace="ankilabs",job="monitoring/ankilabs-api-gateway"})
            or absent(up{namespace="ankilabs",service="dictionary-lookup"})
            or absent(up{namespace="ankilabs",service="sentence-lookup"})
            or absent(up{namespace="ankilabs",service="postgres-exporter"})
            or absent(up{namespace="ankilabs",service="ai-card-actions"})
          for: 5m
          labels:
            scope: applications
            severity: warning
          annotations:
            name: AnkiLabs metrics target missing
            subject: '{{ or $labels.service $labels.job }}'
            description: No metrics target is discovered for this service for 5 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/ankilabs-service-health
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#telemetry
        - alert: AnkiLabsAIErrorRatioHigh
          # Window counts include a series first seen inside the window (its first error precedes its first scrape).
          # Usage Code errors and ai_refused are user or model outcomes, not failures of the AI path.
          expr: |
            (
              sum by (namespace, action) (
                (
                  ankilabs_ai_card_actions_llm_errors_total{namespace="ankilabs",error_code!~"usage_code_.*|ai_refused"}
                  unless
                  ankilabs_ai_card_actions_llm_errors_total{namespace="ankilabs",error_code!~"usage_code_.*|ai_refused"} offset 15m
                )
                or
                increase(ankilabs_ai_card_actions_llm_errors_total{namespace="ankilabs",error_code!~"usage_code_.*|ai_refused"}[15m])
              )
              /
              sum by (namespace, action) (
                (
                  ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs"}
                  unless
                  ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs"} offset 15m
                )
                or
                increase(ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs"}[15m])
              )
            ) > 0.2
            and on (namespace, action)
            sum by (namespace, action) (
              (
                ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs"}
                unless
                ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs"} offset 15m
              )
              or
              increase(ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs"}[15m])
            ) >= 3
          labels:
            scope: applications
            severity: warning
          annotations:
            name: AnkiLabs AI calls failing
            subject: '{{ $labels.action }} · {{ $value | humanizePercentage }} failed'
            description: More than 20% of the action's LLM calls failed over 15 minutes (at least 3 calls).
            dashboard_url: https://grafana.ankilabs.org/d/ankilabs-ai
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#ai
        - alert: ApplicationDeploymentUnavailable
          expr: |
            kube_deployment_spec_replicas{namespace=~"ankilabs|quizlabs"} > 0
            and on (namespace, deployment)
            kube_deployment_status_replicas_available{namespace=~"ankilabs|quizlabs"} == 0
          for: 5m
          labels:
            scope: applications
            severity: warning
          annotations:
            name: Deployment unavailable
            subject: '{{ $labels.namespace }}/{{ $labels.deployment }}'
            description: The deployment has desired replicas but none available for 5 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/homelab-overview
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#resources
        - alert: ApplicationOOMKilled
          expr: |
            (kube_pod_container_status_last_terminated_reason{namespace=~"ankilabs|quizlabs",reason="OOMKilled"} == 1)
            and on (namespace, pod, container)
            (increase(kube_pod_container_status_restarts_total{namespace=~"ankilabs|quizlabs"}[15m]) > 0)
          labels:
            scope: applications
            severity: warning
          annotations:
            name: Container OOM killed
            subject: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})'
            description: The container was OOM killed and restarted in the last 15 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/homelab-overview
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#resources
        - alert: LookupPoolWaiting
          expr: |
            {__name__=~"ankilabs_(sentence|dictionary)_lookup_db_pool_connections",namespace="ankilabs",state="waiting"} > 0
          for: 3m
          labels:
            scope: database
            severity: warning
          annotations:
            name: Lookup DB pool waiting
            subject: '{{ $labels.pod }} · {{ $value }} waiting'
            description: Lookup requests have waited for a database connection for 3 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/ankilabs-search-postgres
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#database
    - name: homelab.database
      rules:
        - alert: PostgreSQLUnavailable
          expr: pg_up{namespace="ankilabs"} == 0
          for: 2m
          labels:
            scope: database
            severity: critical
          annotations:
            name: PostgreSQL unreachable
            subject: '{{ $labels.namespace }} PostgreSQL'
            description: The exporter's monitoring login cannot connect to PostgreSQL.
            dashboard_url: https://grafana.ankilabs.org/d/ankilabs-search-postgres
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#database
        - alert: PostgreSQLCollectorFailure
          expr: pg_scrape_collector_success{namespace="ankilabs"} == 0
          for: 3m
          labels:
            scope: database
            severity: warning
          annotations:
            name: PostgreSQL collector failing
            subject: '{{ $labels.collector }}'
            description: A postgres_exporter collector has failed for 3 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/ankilabs-search-postgres
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#database
        - alert: QuizLabsMongoUnavailable
          expr: kube_statefulset_replicas{namespace="quizlabs",statefulset=~".*mongodb.*"} > 0 and on (namespace, statefulset) kube_statefulset_status_replicas_ready{namespace="quizlabs",statefulset=~".*mongodb.*"} == 0
          for: 5m
          labels:
            scope: database
            severity: warning
          annotations:
            name: QuizLabs MongoDB unavailable
            subject: '{{ $labels.statefulset }}'
            description: The MongoDB StatefulSet has had no ready replica for 5 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/quizlabs-overview
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#quizlabs
    - name: homelab.platform
      rules:
        - alert: EdgeUpstreamFailure
          # The route label names each HTTPRoute rule (k8s/apps/*/httproute.yaml, by rule
          # index); unmapped rules fall back to "<namespace>/<route> rule <index>".
          expr: |
            label_replace(
              label_replace(
                label_replace(
                  label_replace(
                    label_replace(
                      label_replace(
                        sum by (namespace, envoy_cluster_name) (
                          increase(envoy_cluster_upstream_cx_connect_fail{namespace="envoy-gateway-system",envoy_cluster_name=~"httproute/(ankilabs|quizlabs)/.*"}[10m])
                        ) > 0
                        or
                        sum by (namespace, envoy_cluster_name) (
                          increase(envoy_cluster_upstream_rq_timeout{namespace="envoy-gateway-system",envoy_cluster_name=~"httproute/(ankilabs|quizlabs)/.*"}[10m])
                        ) > 0
                        or
                        sum by (namespace, envoy_cluster_name) (
                          envoy_cluster_upstream_cx_connect_fail{namespace="envoy-gateway-system",envoy_cluster_name=~"httproute/(ankilabs|quizlabs)/.*"} > 0
                          unless
                          envoy_cluster_upstream_cx_connect_fail{namespace="envoy-gateway-system",envoy_cluster_name=~"httproute/(ankilabs|quizlabs)/.*"} offset 10m
                        )
                        or
                        sum by (namespace, envoy_cluster_name) (
                          envoy_cluster_upstream_rq_timeout{namespace="envoy-gateway-system",envoy_cluster_name=~"httproute/(ankilabs|quizlabs)/.*"} > 0
                          unless
                          envoy_cluster_upstream_rq_timeout{namespace="envoy-gateway-system",envoy_cluster_name=~"httproute/(ankilabs|quizlabs)/.*"} offset 10m
                        ),
                        "route", "$1/$2 rule $3", "envoy_cluster_name", "httproute/([^/]+)/([^/]+)/rule/([0-9]+)"
                      ),
                      "route", "AnkiLabs API (/api)", "envoy_cluster_name", "httproute/ankilabs/ankilabs/rule/0"
                    ),
                    "route", "AnkiLabs web (/)", "envoy_cluster_name", "httproute/ankilabs/ankilabs/rule/1"
                  ),
                  "route", "QuizLabs API (/api)", "envoy_cluster_name", "httproute/quizlabs/quizlabs/rule/0"
                ),
                "route", "QuizLabs multiplayer (/socket.io)", "envoy_cluster_name", "httproute/quizlabs/quizlabs/rule/1"
              ),
              "route", "QuizLabs web (/)", "envoy_cluster_name", "httproute/quizlabs/quizlabs/rule/2"
            )
          labels:
            scope: platform
            severity: warning
          annotations:
            name: Edge upstream failure
            subject: '{{ $labels.route }}'
            description: Envoy saw an upstream connection failure or timeout for the route in the last 10 minutes.
            # API failures are best read on the application dashboard; other routes on Edge.
            dashboard_url: '{{ if eq $labels.envoy_cluster_name "httproute/ankilabs/ankilabs/rule/0" }}https://grafana.ankilabs.org/d/ankilabs-service-health{{ else }}https://grafana.ankilabs.org/d/platform-delivery-edge{{ end }}'
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#requests
        - alert: EdgeScrapeFailed
          expr: up{job=~"monitoring/(envoy-proxy|cloudflared)"} == 0 or absent(up{job="monitoring/envoy-proxy"}) or absent(up{job="monitoring/cloudflared"})
          for: 5m
          labels:
            scope: platform
            severity: warning
          annotations:
            name: Edge telemetry missing
            subject: '{{ $labels.job }}'
            description: Envoy or cloudflared metrics are missing or failing to scrape for 5 minutes.
            dashboard_url: https://grafana.ankilabs.org/d/platform-delivery-edge
            runbook_url: https://github.com/liav-hasson/homelab/blob/main/k8s/platform/monitoring/runbook.md#telemetry
