# test_rules.py fills exp_annotations from the checked-in rule annotations.
evaluation_interval: 1m
tests:
  - name: a-single-low-traffic-server-failure-is-visible
    interval: 1m
    input_series:
      - series: 'ankilabs_dictionary_lookup_http_request_duration_seconds_count{namespace="ankilabs",job="monitoring/ankilabs-lookups",service="dictionary-lookup",route="/search",status="500"}'
        values: "0 0 1 1 1 1"
    alert_rule_test:
      - eval_time: 5m
        alertname: AnkiLabsRequestFailure
        exp_alerts:
          - exp_labels:
              namespace: ankilabs
              job: monitoring/ankilabs-lookups
              service: dictionary-lookup
              route: /search
              status: "500"
              scope: applications
              severity: warning
  - name: explicit-upstream-timeout-needs-no-minimum-traffic
    interval: 1m
    input_series:
      - series: 'ankilabs_api_gateway_upstream_request_duration_seconds_count{namespace="ankilabs",service="Sentence Lookup",status="timeout"}'
        values: "0 0 1 1 1 1"
    alert_rule_test:
      - eval_time: 5m
        alertname: AnkiLabsUpstreamFailure
        exp_alerts:
          - exp_labels:
              namespace: ankilabs
              service: Sentence Lookup
              status: timeout
              scope: applications
              severity: warning
  - name: first-failure-before-first-scrape-is-not-lost
    interval: 1m
    input_series:
      - series: 'ankilabs_dictionary_lookup_http_request_duration_seconds_count{namespace="ankilabs",job="monitoring/ankilabs-lookups",service="dictionary-lookup",route="/search",status="500"}'
        values: "1+0x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: AnkiLabsRequestFailure
        exp_alerts:
          - exp_labels:
              namespace: ankilabs
              job: monitoring/ankilabs-lookups
              service: dictionary-lookup
              route: /search
              status: "500"
              scope: applications
              severity: warning
  - name: another-namespace-does-not-trigger-ankilabs-alerts
    interval: 1m
    input_series:
      - series: 'ankilabs_dictionary_lookup_http_request_duration_seconds_count{namespace="quizlabs",status="500"}'
        values: "0 0 1 1 1 1"
    alert_rule_test:
      - eval_time: 5m
        alertname: AnkiLabsRequestFailure
        exp_alerts: []
  - name: continuously-waiting-pool-is-measurable-pressure
    interval: 1m
    input_series:
      - series: 'ankilabs_sentence_lookup_db_pool_connections{namespace="ankilabs",pod="sentence-lookup-fixture",state="waiting"}'
        values: "1+0x5"
    alert_rule_test:
      - eval_time: 4m
        alertname: LookupPoolWaiting
        exp_alerts:
          - exp_labels:
              namespace: ankilabs
              pod: sentence-lookup-fixture
              state: waiting
              scope: database
              severity: warning
  - name: missing-dictionary-target-is-not-green
    interval: 1m
    input_series:
      - series: 'up{namespace="ankilabs",job="monitoring/ankilabs-api-gateway"}'
        values: "1+0x7"
      - series: 'up{namespace="ankilabs",service="sentence-lookup"}'
        values: "1+0x7"
      - series: 'up{namespace="ankilabs",service="postgres-exporter"}'
        values: "1+0x7"
      - series: 'up{namespace="ankilabs",service="ai-card-actions"}'
        values: "1+0x7"
    alert_rule_test:
      - eval_time: 6m
        alertname: AnkiLabsExpectedTargetMissing
        exp_alerts:
          - exp_labels:
              namespace: ankilabs
              service: dictionary-lookup
              scope: applications
              severity: warning
  - name: reachable-exporter-with-failed-collector-is-not-green
    interval: 1m
    input_series:
      - series: 'pg_scrape_collector_success{namespace="ankilabs",collector="stat_activity"}'
        values: "0+0x5"
    alert_rule_test:
      - eval_time: 4m
        alertname: PostgreSQLCollectorFailure
        exp_alerts:
          - exp_labels:
              namespace: ankilabs
              collector: stat_activity
              scope: database
              severity: warning
  - name: an-empty-idle-pool-is-not-pressure
    interval: 1m
    input_series:
      - series: 'ankilabs_dictionary_lookup_db_pool_connections{namespace="ankilabs",state="waiting"}'
        values: "0+0x5"
    alert_rule_test:
      - eval_time: 4m
        alertname: LookupPoolWaiting
        exp_alerts: []
  - name: quizlabs-native-edge-failure-is-scoped-and-not-lost-at-first-scrape
    interval: 1m
    input_series:
      - series: 'envoy_cluster_upstream_cx_connect_fail{namespace="envoy-gateway-system",envoy_cluster_name="httproute/quizlabs/quizlabs/rule/1"}'
        values: "0+0x5"
      - series: 'envoy_cluster_upstream_rq_timeout{namespace="envoy-gateway-system",envoy_cluster_name="httproute/quizlabs/quizlabs/rule/1"}'
        values: "1+0x5"
    alert_rule_test:
      - eval_time: 3m
        alertname: EdgeUpstreamFailure
        exp_alerts:
          - exp_labels:
              namespace: envoy-gateway-system
              envoy_cluster_name: httproute/quizlabs/quizlabs/rule/1
              scope: platform
              severity: warning
  - name: node-filesystem-below-fifteen-percent-free-alerts
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node:9100",job="node-exporter",device="/dev/nvme0n1p2",fstype="ext4",mountpoint="/"}'
        values: "10+0x15"
      - series: 'node_filesystem_size_bytes{instance="node:9100",job="node-exporter",device="/dev/nvme0n1p2",fstype="ext4",mountpoint="/"}'
        values: "100+0x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: NodeFilesystemLowSpace
        exp_alerts:
          - exp_labels:
              instance: node:9100
              job: node-exporter
              device: /dev/nvme0n1p2
              fstype: ext4
              mountpoint: /
              scope: nodes
              severity: warning
  - name: full-tmpfs-is-not-node-disk-pressure
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node:9100",job="node-exporter",device="tmpfs",fstype="tmpfs",mountpoint="/dev/shm"}'
        values: "1+0x15"
      - series: 'node_filesystem_size_bytes{instance="node:9100",job="node-exporter",device="tmpfs",fstype="tmpfs",mountpoint="/dev/shm"}'
        values: "100+0x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: NodeFilesystemLowSpace
        exp_alerts: []
  - name: sustained-write-trend-predicts-full-within-three-days
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node:9100",job="node-exporter",device="/dev/nvme0n1p2",fstype="ext4",mountpoint="/"}'
        values: "3000-1x90"
    alert_rule_test:
      - eval_time: 90m
        alertname: NodeFilesystemFillingUp
        exp_alerts:
          - exp_labels:
              instance: node:9100
              job: node-exporter
              device: /dev/nvme0n1p2
              fstype: ext4
              mountpoint: /
              scope: nodes
              severity: warning
  - name: stable-filesystem-is-not-filling
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="node:9100",job="node-exporter",device="/dev/nvme0n1p2",fstype="ext4",mountpoint="/"}'
        values: "3000+0x90"
    alert_rule_test:
      - eval_time: 90m
        alertname: NodeFilesystemFillingUp
        exp_alerts: []
  - name: ai-error-ratio-above-twenty-percent-alerts-per-action
    interval: 1m
    input_series:
      - series: 'ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs",pod="ai-card-actions-fixture",action="notes",model="ankilabs-medium",outcome="success"}'
        values: "0x15 1 2 3 4 4 4 4"
      - series: 'ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs",pod="ai-card-actions-fixture",action="notes",model="ankilabs-medium",outcome="error"}'
        values: "0x15 0 0 1 2 2 2 2"
      - series: 'ankilabs_ai_card_actions_llm_errors_total{namespace="ankilabs",pod="ai-card-actions-fixture",action="notes",model="ankilabs-medium",error_code="ai_timeout"}'
        values: "0x15 0 0 1 2 2 2 2"
      - series: 'ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs",pod="ai-card-actions-fixture",action="sentences",model="ankilabs-medium",outcome="success"}'
        values: "0x15 2 4 6 8 8 8 8"
    alert_rule_test:
      - eval_time: 21m
        alertname: AnkiLabsAIErrorRatioHigh
        exp_alerts:
          - exp_labels:
              namespace: ankilabs
              action: notes
              scope: applications
              severity: warning
  - name: ai-first-errors-before-first-scrape-are-counted
    interval: 1m
    input_series:
      - series: 'ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs",pod="ai-card-actions-fixture",action="review",model="ankilabs-medium",outcome="success"}'
        values: "_x4 2x5"
      - series: 'ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs",pod="ai-card-actions-fixture",action="review",model="ankilabs-medium",outcome="error"}'
        values: "_x4 1x5"
      - series: 'ankilabs_ai_card_actions_llm_errors_total{namespace="ankilabs",pod="ai-card-actions-fixture",action="review",model="ankilabs-medium",error_code="ai_output_invalid"}'
        values: "_x4 1x5"
    alert_rule_test:
      - eval_time: 8m
        alertname: AnkiLabsAIErrorRatioHigh
        exp_alerts:
          - exp_labels:
              namespace: ankilabs
              action: review
              scope: applications
              severity: warning
  - name: ai-errors-below-minimum-traffic-do-not-alert
    interval: 1m
    input_series:
      - series: 'ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs",pod="ai-card-actions-fixture",action="speech",model="ankilabs-tts",outcome="error"}'
        values: "_x4 2x5"
      - series: 'ankilabs_ai_card_actions_llm_errors_total{namespace="ankilabs",pod="ai-card-actions-fixture",action="speech",model="ankilabs-tts",error_code="ai_timeout"}'
        values: "_x4 2x5"
    alert_rule_test:
      - eval_time: 8m
        alertname: AnkiLabsAIErrorRatioHigh
        exp_alerts: []
  - name: ai-usage-code-and-refusal-errors-do-not-alert
    interval: 1m
    input_series:
      - series: 'ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs",pod="ai-card-actions-fixture",action="sentences",model="ankilabs-medium",outcome="success"}'
        values: "_x4 1x5"
      - series: 'ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs",pod="ai-card-actions-fixture",action="sentences",model="ankilabs-medium",outcome="error"}'
        values: "_x4 5x5"
      - series: 'ankilabs_ai_card_actions_llm_errors_total{namespace="ankilabs",pod="ai-card-actions-fixture",action="sentences",model="ankilabs-medium",error_code="usage_code_exhausted"}'
        values: "_x4 3x5"
      - series: 'ankilabs_ai_card_actions_llm_errors_total{namespace="ankilabs",pod="ai-card-actions-fixture",action="sentences",model="ankilabs-medium",error_code="ai_refused"}'
        values: "_x4 2x5"
    alert_rule_test:
      - eval_time: 8m
        alertname: AnkiLabsAIErrorRatioHigh
        exp_alerts: []
  - name: ai-error-ratio-at-or-below-twenty-percent-does-not-alert
    interval: 1m
    input_series:
      - series: 'ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs",pod="ai-card-actions-fixture",action="notes",model="ankilabs-medium",outcome="success"}'
        values: "_x4 9x5"
      - series: 'ankilabs_ai_card_actions_llm_request_duration_seconds_count{namespace="ankilabs",pod="ai-card-actions-fixture",action="notes",model="ankilabs-medium",outcome="error"}'
        values: "_x4 1x5"
      - series: 'ankilabs_ai_card_actions_llm_errors_total{namespace="ankilabs",pod="ai-card-actions-fixture",action="notes",model="ankilabs-medium",error_code="ai_unavailable"}'
        values: "_x4 1x5"
    alert_rule_test:
      - eval_time: 8m
        alertname: AnkiLabsAIErrorRatioHigh
        exp_alerts: []
