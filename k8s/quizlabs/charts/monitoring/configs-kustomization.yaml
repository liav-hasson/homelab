apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-configs
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s/quizlabs/charts/monitoring/configs
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Wait for kube-prometheus-stack to be installed before applying PodMonitor
  # and dashboards — the PodMonitor CRD only exists after the HelmRelease lands
  dependsOn:
    - name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring
