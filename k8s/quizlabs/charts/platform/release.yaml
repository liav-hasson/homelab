apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform
  namespace: platform
spec:
  interval: 1h
  install:
    createNamespace: true
  dependsOn:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  chart:
    spec:
      chart: k8s/quizlabs/charts/platform
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
