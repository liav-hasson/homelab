apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb
  namespace: mongodb
spec:
  interval: 1h
  install:
    createNamespace: true
  dependsOn:
    - name: openebs
      namespace: openebs
  chart:
    spec:
      chart: k8s/quizlabs/charts/stateful/mongodb
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  valuesFrom:
    - kind: Secret
      name: mongodb-helm-values
      valuesKey: values.yaml
