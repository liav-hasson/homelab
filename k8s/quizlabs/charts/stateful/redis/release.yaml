apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: redis
spec:
  interval: 1h
  install:
    createNamespace: true
  dependsOn:
    - name: openebs
      namespace: openebs
  chart:
    spec:
      chart: k8s/quizlabs/charts/stateful/redis
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
