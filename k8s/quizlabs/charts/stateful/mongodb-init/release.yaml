apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-init
  namespace: mongodb
spec:
  interval: 1h
  install:
    createNamespace: true
  dependsOn:
    - name: mongodb
      namespace: mongodb
  chart:
    spec:
      chart: k8s/quizlabs/charts/stateful/mongodb-init
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
