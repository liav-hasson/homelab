apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: discord-deployments
  namespace: ankilabs
spec:
  providerRef:
    name: discord
  eventSeverity: info
  eventSources:
    - kind: HelmRelease
      name: "*"
      namespace: ankilabs
  inclusionList:
    - ".*Helm (install|upgrade) succeeded.*"
  eventMetadata:
    cluster: liav-homelab
    environment: homelab
    project: ankilabs
    summary: "AnkiLabs release deployed successfully"
