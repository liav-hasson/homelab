apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-card-actions
  namespace: ankilabs
spec:
  interval: 1h
  dependsOn:
    - name: llm-proxy
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: ankilabs-features
      valuesKey: values.yaml
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/ai-card-actions
      tag: "0.1.9" # {"$imagepolicy": "ankilabs:ai-card-actions:tag"}
      digest: "sha256:7f56caaa928847e4b885880d600ac03411f1b66f8e22295cd5107a6bf04a4bba" # {"$imagepolicy": "ankilabs:ai-card-actions:digest"}
    env:
      - name: LLM_PROXY_URL
        value: http://llm-proxy
      # Below the API Gateway's AI timeout (90s), which stays below Cloudflare's 100s origin timeout.
      - name: LLM_PROXY_TIMEOUT_SECONDS
        value: "75"
      # Per action: a logical LiteLLM model (see llm-proxy/release.yaml), an optional reasoning-effort override
      # (null keeps the model's default), and an output-token cap bounding one request's cost.
      - name: AI_ACTIONS
        value: >-
          {"sentences": {"model": "ankilabs-medium", "reasoning_effort": null, "max_output_tokens": 6000},

           "notes": {"model": "ankilabs-medium", "reasoning_effort": null, "max_output_tokens": 8000},
           "review": {"model": "ankilabs-medium", "reasoning_effort": null, "max_output_tokens": 6000}}
      - name: SENTENCE_COUNT
        value: "10"
      # Text-to-speech: the logical LiteLLM model, a per-request character cap bounding one clip's cost, and the
      # voice catalog per language. ElevenLabs default voices: verify with GET /v2/voices; defaults expire
      # 2026-12-31; replace with native-accent Voice Library voices on a paid plan. The free tier allows only these
      # default (multilingual, non-native-accent) voices and requires crediting elevenlabs.io, which exports do.
      - name: SPEECH
        value: >-
          {"model": "ankilabs-tts", "max_characters": 500, "response_format": "mp3",

           "voices": {
             "es": [{"id": "htFfPSZGJwjBv1CL0aMD", "name": "Antonio", "gender": "male", "accent": "Latin America"},
                    {"id": "bN1bDXgDIGX5lw0rtY2B", "name": "Melanie", "gender": "female", "accent": "Argentina"},
                    {"id": "6WgXEzo1HGn3i7ilT4Fh", "name": "Vicente", "gender": "male", "accent": "Chile"},
                    {"id": "spPXlKT5a4JMfbhPRAzA", "name": "Camila", "gender": "female", "accent": "Mexico"},
                    {"id": "KHCvMklQZZo0O30ERnVn", "name": "Sara", "gender": "female", "accent": "Spain"}],
             "fr": [{"id": "McVZB9hVxVSk3Equu8EH", "name": "Audrey", "gender": "female", "accent": "Standard"},
                    {"id": "FvmvwvObRqIHojkEGh5N", "name": "Adina", "gender": "female", "accent": "Standard"},
                    {"id": "ohItIVrXTBI80RrUECOD", "name": "Guillaume", "gender": "male", "accent": "Standard"},
                    {"id": "93nuHbke4dTER9x2pDwE", "name": "Adam", "gender": "male", "accent": "Quebec"},
                    {"id": "t8BrjWUT5Z23DLLBzbuY", "name": "Sarah", "gender": "female", "accent": "Standard"}],
             "en": [{"id": "EXAVITQu4vr4xnSDxMaL", "name": "Sarah", "gender": "female", "accent": "American"},
                    {"id": "Xb7hH8MSUJpSbSDYk0k2", "name": "Alice", "gender": "female", "accent": "British"},
                    {"id": "JBFqnCBsd6RMkjVDRZzb", "name": "George", "gender": "male", "accent": "British"},
                    {"id": "nPczCjzI2devNBz1zQrb", "name": "Brian", "gender": "male", "accent": "American"},
                    {"id": "IKne3meq5aSn9XLyUdCD", "name": "Charlie", "gender": "male", "accent": "Australian"}]}}
    probes:
      # Readiness follows the LLM Proxy; liveness must not, since a restart does not fix it.
      liveness:
        httpGet:
          path: /version
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 192Mi
