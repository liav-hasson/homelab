apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-card-actions
  namespace: ankilabs
spec:
  interval: 1h
  dependsOn:
    - name: llm-proxy
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: ankilabs-features
      valuesKey: values.yaml
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/ai-card-actions
      tag: "0.1.2" # {"$imagepolicy": "ankilabs:ai-card-actions:tag"}
      digest: "sha256:1cb6875ae479c1e7a38712b999fcb782e95a30a22785fc4fd1afbdd8424c4a81" # {"$imagepolicy": "ankilabs:ai-card-actions:digest"}
    env:
      - name: LLM_PROXY_URL
        value: http://llm-proxy
      # Below the API Gateway's AI timeout (90s), which stays below Cloudflare's 100s origin timeout.
      - name: LLM_PROXY_TIMEOUT_SECONDS
        value: "75"
      # Per action: a logical LiteLLM model (see llm-proxy/release.yaml), an optional reasoning-effort override
      # (null keeps the model's default), and an output-token cap bounding one request's cost.
      - name: AI_ACTIONS
        value: >-
          {"sentences": {"model": "ankilabs-medium", "reasoning_effort": null, "max_output_tokens": 6000},

           "notes": {"model": "ankilabs-medium", "reasoning_effort": null, "max_output_tokens": 8000},
           "review": {"model": "ankilabs-medium", "reasoning_effort": null, "max_output_tokens": 6000}}
      - name: SENTENCE_COUNT
        value: "10"
    probes:
      # Readiness follows the LLM Proxy; liveness must not, since a restart does not fix it.
      liveness:
        httpGet:
          path: /version
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 192Mi
