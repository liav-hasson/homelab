apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: anki-exchange
  namespace: ankilabs
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: ankilabs-features
      valuesKey: values.yaml
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/anki-exchange
      tag: "0.1.12" # {"$imagepolicy": "ankilabs:anki-exchange:tag"}
      digest: "sha256:b3418e19a31d04e8ab7d5720f94629e26882a9ac9da2cf6ee60482606083486a" # {"$imagepolicy": "ankilabs:anki-exchange:digest"}
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        # Headroom for audio exports: an export holds its body (about 21 MB base64 for 16 MB of audio), the decoded audio,
        # and the built package at once; genanki also stages the audio in /tmp (chart emptyDir, 64Mi).
        memory: 256Mi
