apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: anki-exchange
  namespace: ankilabs
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: ankilabs-features
      valuesKey: values.yaml
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/anki-exchange
      tag: "0.1.7" # {"$imagepolicy": "ankilabs:anki-exchange:tag"}
      digest: "sha256:d75ae1320c1b3caef6986656fcae1fe1d98fd5bee3d7b213e66862b6a1db200a" # {"$imagepolicy": "ankilabs:anki-exchange:digest"}
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 192Mi
