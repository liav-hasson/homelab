# Anki Exchange needs no outbound connections; it only answers the API Gateway (docs/spec/anki-exchange.md).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: anki-exchange
  namespace: ankilabs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: anki-exchange
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - port: http
          protocol: TCP
  egress: []
