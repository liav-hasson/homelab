apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: api-gateway
  namespace: ankilabs
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: ankilabs-features
      valuesKey: values.yaml
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/api-gateway
      tag: "0.1.22" # {"$imagepolicy": "ankilabs:api-gateway:tag"}
      digest: "sha256:f9799ab27a2b41c03cd2758283b63e3698ba20daf3020f4dca8b27850db286f6" # {"$imagepolicy": "ankilabs:api-gateway:digest"}
    env:
      - name: DICTIONARY_LOOKUP_URL
        value: http://dictionary-lookup
      - name: SENTENCE_LOOKUP_URL
        value: http://sentence-lookup
      - name: ANKI_EXCHANGE_URL
        value: http://anki-exchange
      - name: AUTHORIZATION_URL
        value: http://authorization
      - name: AI_CARD_ACTIONS_URL
        value: http://ai-card-actions
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        # Headroom for audio exports: an export holds its body (up to 24 MB) as bytes, parsed JSON, and the re-serialized
        # forward at once.
        memory: 256Mi
