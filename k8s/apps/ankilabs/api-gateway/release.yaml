apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: api-gateway
  namespace: ankilabs
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/api-gateway
      tag: "0.1.3" # {"$imagepolicy": "ankilabs:api-gateway:tag"}
      digest: "sha256:d80849adbf6af8305e65b2d3c6a39b002db2cc5ea0a8526b4f0136781d11fb7b" # {"$imagepolicy": "ankilabs:api-gateway:digest"}
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        memory: 192Mi
