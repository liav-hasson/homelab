apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: api-gateway
  namespace: ankilabs
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: ankilabs-features
      valuesKey: values.yaml
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/api-gateway
      tag: "0.1.20" # {"$imagepolicy": "ankilabs:api-gateway:tag"}
      digest: "sha256:6efc7ae2764ccbd57b621fdc3c59fe16f7beba8fce4d68c0d15deacc9e801bf4" # {"$imagepolicy": "ankilabs:api-gateway:digest"}
    env:
      - name: DICTIONARY_LOOKUP_URL
        value: http://dictionary-lookup
      - name: SENTENCE_LOOKUP_URL
        value: http://sentence-lookup
      - name: ANKI_EXCHANGE_URL
        value: http://anki-exchange
      - name: AUTHORIZATION_URL
        value: http://authorization
      - name: AI_CARD_ACTIONS_URL
        value: http://ai-card-actions
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        memory: 192Mi
