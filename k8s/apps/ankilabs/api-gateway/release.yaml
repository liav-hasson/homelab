apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: api-gateway
  namespace: ankilabs
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: ankilabs-features
      valuesKey: values.yaml
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/api-gateway
      tag: "0.1.11" # {"$imagepolicy": "ankilabs:api-gateway:tag"}
      digest: "sha256:cfb42f4907acafd1cd03012a133c55a6e7489703d59d34656bf11f79d895195e" # {"$imagepolicy": "ankilabs:api-gateway:digest"}
    env:
      - name: DICTIONARY_LOOKUP_URL
        value: http://dictionary-lookup
      - name: SENTENCE_LOOKUP_URL
        value: http://sentence-lookup
      - name: ANKI_EXCHANGE_URL
        value: http://anki-exchange
    resources:
      requests:
        cpu: 20m
        memory: 96Mi
      limits:
        memory: 192Mi
