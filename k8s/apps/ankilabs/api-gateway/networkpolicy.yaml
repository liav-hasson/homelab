# API Gateway answers Envoy Gateway and reaches only its downstream internal services and CoreDNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway
  namespace: ankilabs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dictionary-lookup
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sentence-lookup
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: anki-exchange
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: authorization
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ai-card-actions
      ports:
        - port: http
          protocol: TCP
