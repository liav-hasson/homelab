apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llm-proxy
  namespace: ankilabs
spec:
  interval: 1h
  dependsOn:
    - name: postgres
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/llm-proxy
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    image:
      tag: v1.106.1
      digest: "sha256:233f6fee10b475e30b5db671fd48bfa4626442f3f99a15ec197f2fbe724948c4"
    envFromSecrets:
      - llm-proxy-providers
      - llm-proxy-elevenlabs
      - llm-proxy-admin
    database:
      passwordSecret:
        name: llm-proxy-database
    config:
      # Logical model names are what Usage Codes allow and what AI Card Actions requests.
      model_list:
        - model_name: ankilabs-medium
          litellm_params:
            model: openai/gpt-6-luna
            api_key: os.environ/OPENAI_API_KEY
            reasoning_effort: medium
        # Text-to-speech (/v1/audio/speech) for AI Card Actions. Budgets draw down only through LiteLLM's bundled
        # cost map, which prices eleven_multilingual_v2 per character: custom per-character prices are ignored for
        # speech (LiteLLM #44200), so after any image bump check that a call records spend > 0 (dev/litellm-checks.sh).
        - model_name: ankilabs-tts
          litellm_params:
            model: elevenlabs/eleven_multilingual_v2
            api_key: os.environ/ELEVENLABS_API_KEY
          model_info:
            mode: audio_speech
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        memory: 1Gi
