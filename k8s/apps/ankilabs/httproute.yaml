apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ankilabs
  namespace: ankilabs
spec:
  hostnames:
    - ankilabs.org
  parentRefs:
    - name: homelab-gateway
      namespace: platform
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-gateway
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
