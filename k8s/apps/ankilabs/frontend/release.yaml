apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend
  namespace: ankilabs
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/frontend
      tag: "0.1.2" # {"$imagepolicy": "ankilabs:frontend:tag"}
      digest: "sha256:df2e47bfe4e7b811fc0a0be500e2d9489a226ef9646b65e8281f86790bf67076" # {"$imagepolicy": "ankilabs:frontend:digest"}
    containerPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
