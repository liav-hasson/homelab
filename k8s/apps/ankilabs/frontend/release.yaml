apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend
  namespace: ankilabs
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: ankilabs-features
      valuesKey: values.yaml
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/frontend
      tag: "0.1.21" # {"$imagepolicy": "ankilabs:frontend:tag"}
      digest: "sha256:f9defa41fe93b3a82e8a413bf17ab6897417e34bb51877bb686f00b20f53e679" # {"$imagepolicy": "ankilabs:frontend:digest"}
    containerPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
