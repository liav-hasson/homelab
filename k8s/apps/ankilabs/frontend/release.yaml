apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend
  namespace: ankilabs
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: ankilabs-features
      valuesKey: values.yaml
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/frontend
      tag: "0.1.17" # {"$imagepolicy": "ankilabs:frontend:tag"}
      digest: "sha256:b5dd99d97ea3680255c9498e9672760c3b0cdee3b4a29c8a1147ae5a1a6f00cb" # {"$imagepolicy": "ankilabs:frontend:digest"}
    containerPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
