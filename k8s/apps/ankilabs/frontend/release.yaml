apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frontend
  namespace: ankilabs
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/frontend
      tag: "0.1.1" # {"$imagepolicy": "ankilabs:frontend:tag"}
      digest: "sha256:58d39235464beaaa8a94b717a2d108c6953e9ea8ed214f86a248c5d4ad54728f" # {"$imagepolicy": "ankilabs:frontend:digest"}
    containerPort: 8080
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
