apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sentence-lookup
  namespace: ankilabs
spec:
  interval: 1h
  dependsOn:
    - name: postgres
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: ankilabs-features
      valuesKey: values.yaml
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/sentence-lookup
      tag: "0.1.18" # {"$imagepolicy": "ankilabs:sentence-lookup:tag"}
      digest: "sha256:c653bbca3a063bdcc29e3a990a696baee12a7d3b67fd4cc120b6bb5de9c8cf95" # {"$imagepolicy": "ankilabs:sentence-lookup:digest"}
    env:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: sentence-lookup-db
            key: DATABASE_URL
      # DEBUG also logs request content (search queries); INFO logs only fingerprints and request IDs.
      - name: LOG_LEVEL
        value: INFO
    probes:
      # Liveness must not depend on the database: restarting the pod does not fix a database outage.
      liveness:
        httpGet:
          path: /version
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
