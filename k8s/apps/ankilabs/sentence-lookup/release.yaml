apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sentence-lookup
  namespace: ankilabs
spec:
  interval: 1h
  dependsOn:
    - name: postgres
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: ankilabs-features
      valuesKey: values.yaml
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/sentence-lookup
      tag: "0.1.9" # {"$imagepolicy": "ankilabs:sentence-lookup:tag"}
      digest: "sha256:9ef38a8a17670029dbe73afa0d3d22ad7e2c158c34359c28c4caaf0843e8ad94" # {"$imagepolicy": "ankilabs:sentence-lookup:digest"}
    env:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: sentence-lookup-db
            key: DATABASE_URL
    probes:
      # Liveness must not depend on the database: restarting the pod does not fix a database outage.
      liveness:
        httpGet:
          path: /version
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
