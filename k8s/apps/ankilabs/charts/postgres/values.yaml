image:
  repository: postgres
  tag: "18.6"
  pullPolicy: IfNotPresent

database: ankilabs
# Privileged role used only by the operator (through a port-forward) to publish dictionary and corpus versions.
user: ankilabs

# Secret with POSTGRES_PASSWORD, DICTIONARY_READER_PASSWORD, and SENTENCE_READER_PASSWORD.
existingSecret: postgres-credentials

persistence:
  size: 100Gi
  # Empty selects the cluster default storage class.
  storageClass: ""

# Passed to postgres as -c settings; sized for a 4 GiB container limit.
config:
  max_connections: 50
  shared_buffers: 1GB
  effective_cache_size: 3GB
  work_mem: 16MB
  maintenance_work_mem: 512MB
  max_wal_size: 8GB
  checkpoint_timeout: 15min
  # Keep stderr in the existing container log pipeline; jsonlog needs collector files.
  log_destination: stderr
  logging_collector: "off"
  log_line_prefix: "%m [%p] app=%a sqlstate=%e "
  log_error_verbosity: terse
  log_statement: none
  log_min_error_statement: panic
  log_min_duration_statement: -1
  log_min_duration_sample: -1
  log_transaction_sample_rate: 0
  log_duration: "off"
  log_parameter_max_length: 0
  log_parameter_max_length_on_error: 0

# Every workload declares requests and limits (see docs/spec/cd.md).
resources: {}

service:
  port: 5432

# Postgres only needs these writable besides its data volume; /dev/shm counts toward the memory limit.
shmSize: 512Mi

monitoring:
  enabled: false
  # Provision the separate login role and Secret BEFORE enabling; see monitoring/runbook.md.
  existingSecret: postgres-monitoring
  user: ankilabs_monitor
  image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
