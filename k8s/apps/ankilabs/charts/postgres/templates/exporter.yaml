{{- if .Values.monitoring.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-exporter
  labels:
    app.kubernetes.io/name: postgres-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-exporter
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-exporter
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: {{ .Values.monitoring.image | quote }}
          args:
            - --web.listen-address=:9187
            - --disable-default-metrics
            - --collector.database
            - --collector.locks
            - --collector.settings
            - --collector.stat_activity
            - --collector.stat_bgwriter
            - --collector.stat_checkpointer
            - --collector.stat_database
            - --no-collector.replication
            - --no-collector.replication_slots
            - --no-collector.stat_archiver
            - --no-collector.stat_progress_vacuum
            - --no-collector.stat_replication
            - --no-collector.stat_user_tables
            - --no-collector.statio_user_tables
            - --no-collector.wal
            - --no-collector.stat_statements
          env:
            - name: DATA_SOURCE_URI
              value: {{ printf "%s:5432/%s?sslmode=disable&connect_timeout=5&application_name=postgres_exporter" .Release.Name .Values.database | quote }}
            - name: DATA_SOURCE_USER
              value: {{ .Values.monitoring.user | quote }}
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.monitoring.existingSecret }}
                  key: password
            - name: PG_EXPORTER_COLLECTION_TIMEOUT
              value: 8s
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            tcpSocket:
              port: metrics
          livenessProbe:
            tcpSocket:
              port: metrics
          resources:
            {{- toYaml .Values.monitoring.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
{{- end }}
