# Creates LiteLLM's role and database on the shared Postgres, and keeps the role's password in sync with its Secret.
# Idempotent, so it runs before every install and upgrade; the Postgres init script stays limited to its own roles.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-bootstrap
  labels:
    {{- include "llm-proxy.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-db-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ .Values.database.bootstrapImage | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              psql -v ON_ERROR_STOP=1 -v role="$LITELLM_DB_USER" -v db="$LITELLM_DB_NAME" -v pw="$LITELLM_DB_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', :'role') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role')\gexec
              ALTER ROLE :"role" WITH LOGIN PASSWORD :'pw';
              SELECT format('CREATE DATABASE %I OWNER %I', :'db', :'role') WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db')\gexec
              -- Other AnkiLabs roles (the lookups' readers) cannot connect to LiteLLM's database.
              REVOKE ALL ON DATABASE :"db" FROM PUBLIC;
              SQL
          env:
            - name: PGHOST
              value: {{ .Values.database.host | quote }}
            - name: PGPORT
              value: {{ .Values.database.port | quote }}
            - name: PGUSER
              value: {{ .Values.database.admin.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.database.admin.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.admin.passwordSecret.name }}
                  key: {{ .Values.database.admin.passwordSecret.key }}
            - name: LITELLM_DB_USER
              value: {{ .Values.database.user | quote }}
            - name: LITELLM_DB_NAME
              value: {{ .Values.database.name | quote }}
            {{- include "llm-proxy.dbPasswordEnv" . | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
