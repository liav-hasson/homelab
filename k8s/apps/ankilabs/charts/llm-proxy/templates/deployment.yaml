apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "llm-proxy.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "llm-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llm-proxy.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: litellm
          image: {{ include "llm-proxy.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/litellm/config.yaml", "--port", {{ .Values.containerPort | quote }}]
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- with .Values.envFromSecrets }}
          envFrom:
            {{- range . }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          env:
            {{- include "llm-proxy.dbPasswordEnv" . | nindent 12 }}
            - name: DATABASE_URL
              value: {{ printf "postgresql://%s:$(LITELLM_DB_PASSWORD)@%s:%v/%s" .Values.database.user .Values.database.host .Values.database.port .Values.database.name | quote }}
            # Price models from the cost map bundled in the pinned image instead of fetching it at startup.
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True"
            - name: DISABLE_ADMIN_UI
              value: "True"
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # First start applies LiteLLM's database migrations.
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          # Liveness must not depend on the database: restarting the pod does not fix a database outage.
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- if not .Values.resources }}{{ fail "resources are required" }}{{ end }}
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
