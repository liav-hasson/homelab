image:
  repository: ghcr.io/berriai/litellm-database
  # Pinned by hand, not by Flux image automation: pass dev/litellm-checks.sh against a new tag before upgrading.
  tag: ""
  # When set, pods pull by digest.
  digest: ""
  pullPolicy: IfNotPresent

containerPort: 4000

service:
  port: 80

# Secrets loaded whole into the proxy's environment (provider API keys, LITELLM_MASTER_KEY, LITELLM_SALT_KEY).
# They are mounted into this pod only, never into callers.
envFromSecrets: []

env: []

# LiteLLM's own database, created and kept in sync by the pre-install/pre-upgrade bootstrap Job.
database:
  host: postgres
  port: 5432
  name: litellm
  user: litellm
  # Secret key holding the litellm role's password; it must be URL-safe because it is embedded in DATABASE_URL.
  passwordSecret:
    name: ""
    key: LITELLM_DB_PASSWORD
  # Privileged Postgres login the bootstrap Job uses to create the role and database. Only the Job reads it.
  admin:
    user: ankilabs
    database: ankilabs
    passwordSecret:
      name: postgres-credentials
      key: POSTGRES_PASSWORD
  bootstrapImage: postgres:18.6

# Rendered verbatim as LiteLLM's config.yaml; release values merge over these defaults.
# Callers request only the logical model_name entries. A model missing from LiteLLM's bundled cost map is priced at
# $0 and never draws down a key's budget, so such models need explicit input_cost_per_token/output_cost_per_token.
config:
  model_list: []
  litellm_settings:
    # Keeps prompts and completions (user card text) out of logs and callbacks.
    turn_off_message_logging: true
  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    database_url: os.environ/DATABASE_URL
    # Postgres allows 50 connections in total, shared with every other AnkiLabs service.
    database_connection_pool_limit: 5
    store_prompts_in_spend_logs: false

# Every workload declares requests and limits (see docs/spec/cd.md).
resources: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
