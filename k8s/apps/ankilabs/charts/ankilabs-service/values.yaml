image:
  repository: ""
  tag: ""
  # When set, pods pull by digest.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

replicaCount: 1

containerPort: 8000

service:
  port: 80

env: []

# Every workload declares requests and limits (see docs/spec/cd.md).
resources: {}

probes:
  readiness:
    httpGet:
      path: /healthz
      port: http
    periodSeconds: 10
  liveness:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 10
    periodSeconds: 20
    failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
