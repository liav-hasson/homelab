apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dictionary-lookup
  namespace: ankilabs
spec:
  interval: 1h
  dependsOn:
    - name: postgres
  chart:
    spec:
      chart: k8s/apps/ankilabs/charts/ankilabs-service
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    remediation:
      retries: 2
  valuesFrom:
    - kind: ConfigMap
      name: ankilabs-features
      valuesKey: values.yaml
  values:
    image:
      repository: ghcr.io/liav-hasson/ankilabs/dictionary-lookup
      tag: "0.1.8" # {"$imagepolicy": "ankilabs:dictionary-lookup:tag"}
      digest: "sha256:e5c9beb55f130b84c57d7bd7b5ba51e61b700caa6310e1c668561cc82f0c2d08" # {"$imagepolicy": "ankilabs:dictionary-lookup:digest"}
    env:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: dictionary-lookup-db
            key: DATABASE_URL
      # DEBUG also logs request content (lookup queries); INFO logs only fingerprints and request IDs.
      - name: LOG_LEVEL
        value: INFO
    probes:
      # Liveness must not depend on the database: restarting the pod does not fix a database outage.
      liveness:
        httpGet:
          path: /version
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
