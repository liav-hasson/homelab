apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: discord-deployments
  namespace: quizlabs
spec:
  providerRef:
    name: discord
  eventSeverity: info
  eventSources:
    - kind: HelmRelease
      name: "*"
      namespace: quizlabs
  inclusionList:
    - ".*Helm (install|upgrade) succeeded.*"
  eventMetadata:
    cluster: liav-homelab
    environment: homelab
    project: quizlabs
    summary: "QuizLabs release deployed successfully"
