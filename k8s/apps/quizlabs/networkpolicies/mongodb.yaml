# MongoDB answers quiz-backend and mongodb-init job; has no outbound connections.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb
  namespace: quizlabs
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: quiz-backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mongodb-init
      ports:
        - port: 27017
          protocol: TCP
  egress: []
