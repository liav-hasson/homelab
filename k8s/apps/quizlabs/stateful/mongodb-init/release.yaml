apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb-init
  namespace: quizlabs
spec:
  interval: 1h
  install:
    createNamespace: true
  dependsOn:
    - name: mongodb
      namespace: quizlabs
  chart:
    spec:
      chart: k8s/apps/quizlabs/stateful/mongodb-init
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
