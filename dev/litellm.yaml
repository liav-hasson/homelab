# Local LiteLLM config: mock responses only, no provider credentials.
# ankilabs-default is priced deliberately high so dev/litellm-checks.sh can exhaust a small budget in a few calls.
# The dev-* models return one canned answer per AI Card Actions action, cheaply, so the stack runs end to end.
model_list:
  - model_name: ankilabs-default
    litellm_params:
      model: openai/mock
      api_key: unused
      mock_response: '{"candidates": []}'
      input_cost_per_token: 0.01
      output_cost_per_token: 0.01
  - model_name: dev-sentences
    litellm_params:
      model: openai/mock
      api_key: unused
      mock_response: '{"sentences": [{"text": "Guardó el arma en un cajón.", "translation": "He put the weapon in a drawer."}, {"text": "El arma principal del equipo es la defensa.", "translation": "The team’s main weapon is its defense."}, {"text": "La policía encontró el arma del crimen.", "translation": "The police found the murder weapon."}]}'
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
  - model_name: dev-notes
    litellm_params:
      model: openai/mock
      api_key: unused
      mock_response: '{"title": "Word family", "items": [{"text": "armamento — armament", "source": "dictionary"}, {"text": "armar — to arm\narmado — armed", "source": "ai"}]}'
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
  - model_name: dev-review
    litellm_params:
      model: openai/mock
      api_key: unused
      mock_response: '{"findings": [{"rowId": "dev-row-1", "face": "back", "severity": 6, "message": "Feminine nouns starting with a stressed a take el: el arma."}]}'
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  turn_off_message_logging: true
