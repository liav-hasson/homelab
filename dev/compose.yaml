# Local development stack only; never deployed. Expects the app repos cloned next to homelab/.
#   docker compose -f dev/compose.yaml up -d --build
name: ankilabs-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ankilabs
      POSTGRES_PASSWORD: ankilabs-dev
      POSTGRES_DB: ankilabs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ankilabs -d ankilabs"]
      interval: 5s
      retries: 10

  # LiteLLM keeps its virtual keys and spend in its own database; creating it is idempotent.
  litellm-db-init:
    image: postgres:18
    environment:
      PGPASSWORD: ankilabs-dev
    command:
      - sh
      - -c
      - >-
        echo "SELECT 'CREATE DATABASE litellm' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'litellm')\gexec"
        | psql -h postgres -U ankilabs -d ankilabs -v ON_ERROR_STOP=1
    depends_on:
      postgres:
        condition: service_healthy

  # Mock chat models only (dev/litellm.yaml), so local AI work never spends money. The exception is ankilabs-tts:
  # it calls ElevenLabs with the host's ELEVENLABS_API_KEY (never written here) and fails when that is unset.
  litellm:
    image: ghcr.io/berriai/litellm-database:v1.106.1
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://ankilabs:ankilabs-dev@postgres:5432/litellm
      LITELLM_MASTER_KEY: sk-dev-master
      LITELLM_SALT_KEY: sk-dev-salt
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
    volumes:
      - ./litellm.yaml:/etc/litellm/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 5s
      retries: 30
    depends_on:
      litellm-db-init:
        condition: service_completed_successfully

  # Fixed dev keys: Authorization's route-limited key and one Usage Code, registered once (aliases must be unique).
  litellm-keys:
    image: ghcr.io/berriai/litellm-database:v1.106.1
    entrypoint: ["python", "-c"]
    command:
      - |
        import json, urllib.error, urllib.request
        HEADERS = {"Authorization": "Bearer sk-dev-master", "Content-Type": "application/json"}
        def exists(key):
            try:
                urllib.request.urlopen(urllib.request.Request(f"http://litellm:4000/key/info?key={key}", headers=HEADERS))
                return True
            except urllib.error.HTTPError as e:
                if e.code == 404:
                    return False
                raise
        def generate(body):
            if exists(body["key"]):
                return
            request = urllib.request.Request(
                "http://litellm:4000/key/generate", data=json.dumps(body).encode(), headers=HEADERS
            )
            urllib.request.urlopen(request).read()
        generate({"key": "sk-dev-authorization-service", "key_alias": "authorization-service", "max_budget": 0,
                  "models": ["no-models"], "allowed_routes": ["/key/info"]})
        generate({"key": "sk-dev-usage-code-0001", "key_alias": "dev", "max_budget": 5,
                  "models": ["dev-sentences", "dev-notes", "dev-review", "ankilabs-tts"]})
        print("dev keys registered; Usage Code: sk-dev-usage-code-0001")
    depends_on:
      litellm:
        condition: service_healthy

  authorization:
    build:
      context: ../../ankilabs-authorization
    environment:
      LLM_PROXY_URL: http://litellm:4000
      LLM_PROXY_KEY: sk-dev-authorization-service
    ports:
      - "127.0.0.1:8083:8000"
    depends_on:
      litellm-keys:
        condition: service_completed_successfully

  ai-card-actions:
    build:
      context: ../../ankilabs-ai-card-actions
    environment:
      LLM_PROXY_URL: http://litellm:4000
      FEATURE_FLAGS: '{"ai_actions": true, "ai_speech": true}'
      AI_ACTIONS: '{"sentences": {"model": "dev-sentences"}, "notes": {"model": "dev-notes"}, "review": {"model": "dev-review"}}'
      # Two default ElevenLabs voices per language; the full catalog is in k8s/apps/ankilabs/ai-card-actions.
      SPEECH: >-
        {"voices": {
          "es": [{"id": "EXAVITQu4vr4xnSDxMaL", "name": "Sarah", "gender": "female", "accent": "American"},
                 {"id": "JBFqnCBsd6RMkjVDRZzb", "name": "George", "gender": "male", "accent": "British"}],
          "fr": [{"id": "FGY2WhTYpPnrIDTdsKH5", "name": "Laura", "gender": "female", "accent": "American"},
                 {"id": "nPczCjzI2devNBz1zQrb", "name": "Brian", "gender": "male", "accent": "American"}],
          "en": [{"id": "Xb7hH8MSUJpSbSDYk0k2", "name": "Alice", "gender": "female", "accent": "British"},
                 {"id": "TX3LPaxmHKxFdv7VOQHJ", "name": "Liam", "gender": "male", "accent": "American"}]}}
    ports:
      - "127.0.0.1:8084:8000"
    depends_on:
      litellm:
        condition: service_healthy

  # The frontend's dev server proxies /api to localhost:8000.
  api-gateway:
    build:
      context: ../../ankilabs-api-gateway
    environment:
      DICTIONARY_LOOKUP_URL: http://dictionary-lookup:8000
      SENTENCE_LOOKUP_URL: http://sentence-lookup:8000
      AUTHORIZATION_URL: http://authorization:8000
      AI_CARD_ACTIONS_URL: http://ai-card-actions:8000
      FEATURE_FLAGS: '{"ai_actions": true, "ai_speech": true}'
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - authorization
      - ai-card-actions

  dictionary-lookup:
    build:
      context: ../../ankilabs-dictionary
      dockerfile: lookup.Dockerfile
    environment:
      DATABASE_URL: postgresql://ankilabs:ankilabs-dev@postgres:5432/ankilabs
    ports:
      - "127.0.0.1:8081:8000"
    depends_on:
      postgres:
        condition: service_healthy

  sentence-lookup:
    build:
      context: ../../ankilabs-sentences
      dockerfile: lookup.Dockerfile
    environment:
      DATABASE_URL: postgresql://ankilabs:ankilabs-dev@postgres:5432/ankilabs
    ports:
      - "127.0.0.1:8082:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
